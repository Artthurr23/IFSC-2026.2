<!DOCTYPE html>
<html lang="en">
<head>
<Style>
div{border:1px black}
.box{border: 1px solid pink;}
#box1{background-color: blue;
position:fixed;
top: 0px;
left:0px;}
#box2{background-color: chartreuse;
position:relative;
top: 10px;
left:-50px;
}
#box3{background-color: blueviolet;
position:fixed;
top: 75px;
left:50px;
}
#box5{background-color: rgb(199, 61, 157);
position:fixed;
top: 50%;
left:50%;
transform: translate(-50% -50%);
}


.box {
    display: inline-block;
    width: 100px;
    height: 100px;
}

</Style>
</head>
<meta charset="UTF-8">
<meta name="viewport content="vidth-device-width, initial-scale=1.0">
<title>Document</title>
<body>
    
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    <div id="box3" class="box">box3</div>
    <div id="box4" class="box">box4</div>
    <div id="box5" class="box">box5</div>
</body>
</html>
